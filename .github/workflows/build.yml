name: Verify Extreme Tube patches

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.7.0'
          cache-provider: basic

      - name: Validate scripts
        shell: bash
        run: |
          bash -n scripts/build-extreme-tube.sh
          bash -n scripts/security-audit.sh

      - name: Security audit custom source
        shell: bash
        run: bash scripts/security-audit.sh

      - name: Compile patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon --stacktrace

      - name: Confirm no proprietary APK was committed
        shell: bash
        run: |
          if find . -type f \( -iname '*.apk' -o -iname '*.apkm' -o -iname '*.xapk' -o -iname '*.apks' \) -print -quit | grep -q .; then
            echo 'Proprietary Android package detected in repository.' >&2
            exit 1
          fi

      - name: Show bundle checksum
        shell: bash
        run: |
          find patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print -exec sha256sum {} \;
