name: Verify Extreme Tube patches

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          cache-provider: basic

      - name: Validate local build script
        shell: bash
        run: bash -n scripts/build-extreme-tube.sh

      - name: Compile patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon --stacktrace

      - name: Confirm no proprietary APK was committed
        shell: bash
        run: |
          if find . -type f \( -iname '*.apk' -o -iname '*.apkm' -o -iname '*.xapk' -o -iname '*.apks' \) -print -quit | grep -q .; then
            echo 'Proprietary Android package detected in repository.' >&2
            exit 1
          fi

      - name: Show bundle checksum
        shell: bash
        run: |
          find patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print -exec sha256sum {} \;

      - name: Upload verified patch bundle
        uses: actions/upload-artifact@v7
        with:
          name: ExtremeTube-Patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14

      - name: Fetch official Morphe runtime tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-tools
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/MorpheApp/morphe-desktop/releases/download/v1.13.0/morphe-desktop-1.13.0-all.jar' \
            -o upstream-tools/morphe-desktop-1.13.0-all.jar
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/MorpheApp/morphe-patches/releases/download/v1.39.1/patches-1.39.1.mpp' \
            -o upstream-tools/patches-1.39.1.mpp
          test -s upstream-tools/morphe-desktop-1.13.0-all.jar
          test -s upstream-tools/patches-1.39.1.mpp
          jar tf upstream-tools/morphe-desktop-1.13.0-all.jar >/dev/null
          sha256sum upstream-tools/* | tee upstream-tools/SHA256SUMS.txt

      - name: Upload Morphe runtime tools
        uses: actions/upload-artifact@v7
        with:
          name: Morphe-Upstream-Tools
          path: upstream-tools/
          if-no-files-found: error
          retention-days: 2
