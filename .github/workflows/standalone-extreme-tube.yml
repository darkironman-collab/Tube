name: Build Standalone Extreme Tube

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Resolve dependency graph
        run: gradle -p standalone :app:dependencies --configuration debugRuntimeClasspath | tee /tmp/extreme-deps.txt

      - name: Reject Morphe dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq 'morphe|morphi' /tmp/extreme-deps.txt; then
            echo 'Forbidden Morphe dependency detected.' >&2
            exit 1
          fi

      - name: Build standalone APK
        run: gradle -p standalone :app:assembleDebug --stacktrace

      - name: Verify zero Morphe residue in APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find standalone/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          mkdir -p /tmp/extreme-apk
          unzip -q "$APK" -d /tmp/extreme-apk
          if grep -RaiE 'app[./]morphe|morpheapp|api\.morphe|morphi\.app' /tmp/extreme-apk; then
            echo 'Forbidden Morphe residue detected inside APK.' >&2
            exit 1
          fi
          sha256sum "$APK" | tee standalone-apk.sha256
          cp "$APK" ExtremeTube-Standalone-v0.2.0-debug.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: ExtremeTube-Standalone-v0.2.0
          path: |
            ExtremeTube-Standalone-v0.2.0-debug.apk
            standalone-apk.sha256
          if-no-files-found: error
          retention-days: 7
