name: Build Ytube v0.1 Privacy APK

on:
  workflow_dispatch:
  push:
    branches:
      - v0.1-extreme-presets
    paths:
      - '.github/workflows/build-v01-refined.yml'
      - 'patches/**'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-v01-refined.yml'
      - 'patches/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          cache-provider: basic

      - name: Compile Ytube patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :patches:buildAndroid --no-daemon --stacktrace
          EXTREME_MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)"
          test -s "$EXTREME_MPP"
          echo "EXTREME_MPP=$EXTREME_MPP" >> "$GITHUB_ENV"
          sha256sum "$EXTREME_MPP"

      - name: Fetch official Morphe patch runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-input
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/MorpheApp/morphe-desktop/releases/download/v1.13.0/morphe-desktop-1.13.0-all.jar' \
            -o build-input/morphe-desktop.jar
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/MorpheApp/morphe-patches/releases/download/v1.39.1/patches-1.39.1.mpp' \
            -o build-input/morphe-patches.mpp
          jar tf build-input/morphe-desktop.jar >/dev/null
          test -s build-input/morphe-patches.mpp

      - name: Fetch exact YouTube 21.04.223 base APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='78571be679f586d11a4e56fb1ce6bf9dfd958ce6b8af786c4a3bd94792ce8c7c'
          curl --fail --location --retry 4 --retry-all-errors \
            --user-agent 'Mozilla/5.0' \
            'https://d.apkpure.net/b/APK/com.google.android.youtube?versionCode=1561052632' \
            -o build-input/youtube-21.04.223.apk
          test -s build-input/youtube-21.04.223.apk
          ACTUAL="$(sha256sum build-input/youtube-21.04.223.apk | awk '{print $1}')"
          echo "Base APK SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          unzip -tq build-input/youtube-21.04.223.apk >/dev/null

      - name: Build Ytube privacy version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-extreme-tube.sh
          JAVA_BIN="$JAVA_HOME_21_X64/bin/java" scripts/build-extreme-tube.sh \
            build-input/morphe-desktop.jar \
            build-input/morphe-patches.mpp \
            "$EXTREME_MPP" \
            build-input/youtube-21.04.223.apk \
            Ytube-v0.1-privacy.apk

      - name: Verify APK and privacy lockdown
        shell: bash
        run: |
          set -euo pipefail
          APK='Ytube-v0.1-privacy.apk'
          test -s "$APK"
          unzip -tq "$APK" >/dev/null

          rm -rf verify-apk
          mkdir verify-apk
          unzip -q "$APK" 'classes*.dex' 'res/xml/morphe_prefs*.xml' -d verify-apk

          BLOCKED=(
            'api.morphe.software'
            'www.morphe.software'
            'morphe.software'
            'api.morphi.app'
            'github.com/MorpheApp'
            'raw.githubusercontent.com/MorpheApp'
            'cdn.jsdelivr.net/gh/MorpheApp'
            'sponsor.ajay.app'
            'sb.ltn.fi'
            'returnyoutubedislikeapi.com'
            'dearrow-thumb.ajay.app'
            'dearrow.ajay.app'
            'raw.githubusercontent.com/Override92'
            'aisloplist.com'
            'api.mymemory.translated.net'
            'openrouter.ai'
          )

          for endpoint in "${BLOCKED[@]}"; do
            if grep -aR -F -q -- "$endpoint" verify-apk/classes*.dex verify-apk/res/xml 2>/dev/null; then
              echo "ERROR: blocked endpoint survived in executable/resources: $endpoint" >&2
              exit 20
            fi
          done

          for prefs in verify-apk/res/xml/morphe_prefs.xml \
                       verify-apk/res/xml/morphe_prefs_icons.xml \
                       verify-apk/res/xml/morphe_prefs_icons_bold.xml; do
            test -f "$prefs"
            if strings -a "$prefs" | grep -F -q 'morphe_settings_screen_00_about'; then
              echo "ERROR: Morphe About row survived in $prefs" >&2
              exit 21
            fi
          done

          sha256sum "$APK" | tee Ytube-v0.1-privacy.sha256
          printf '%s\n' \
            'Ytube v0.1 Privacy' \
            'Base: YouTube 21.04.223' \
            'Package: com.extremetube.app' \
            'Settings title: YouTube Extra Setting' \
            'Morphe About row removed from normal/icons/bold-icons settings variants.' \
            'Listed non-Google/YouTube endpoints scrubbed from executable DEX/resources.' \
            'Background playback and Ytube Advanced quality/presets retained.' \
            'Required offline GPL/NOTICE attribution remains bundled.' \
            > Ytube-v0.1-privacy-README.txt

      - name: Upload Ytube privacy APK
        uses: actions/upload-artifact@v7
        with:
          name: Ytube-v0.1-privacy
          path: |
            Ytube-v0.1-privacy.apk
            Ytube-v0.1-privacy.sha256
            Ytube-v0.1-privacy-README.txt
          if-no-files-found: error
          retention-days: 14
