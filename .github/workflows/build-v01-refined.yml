name: Build Extreme Tube v0.1 Refined APK

on:
  workflow_dispatch:
  push:
    branches:
      - v0.1-extreme-refined
    paths:
      - '.github/workflows/build-v01-refined.yml'
      - 'patches/**'
      - 'scripts/build-extreme-tube.sh'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'
          cache-provider: basic

      - name: Compile Extreme Tube patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :patches:buildAndroid --no-daemon --stacktrace
          EXTREME_MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)"
          test -s "$EXTREME_MPP"
          echo "EXTREME_MPP=$EXTREME_MPP" >> "$GITHUB_ENV"
          sha256sum "$EXTREME_MPP"

      - name: Fetch official Morphe patch runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-input
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/MorpheApp/morphe-desktop/releases/download/v1.13.0/morphe-desktop-1.13.0-all.jar' \
            -o build-input/morphe-desktop.jar
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/MorpheApp/morphe-patches/releases/download/v1.39.1/patches-1.39.1.mpp' \
            -o build-input/morphe-patches.mpp
          jar tf build-input/morphe-desktop.jar >/dev/null
          test -s build-input/morphe-patches.mpp

      - name: Fetch exact YouTube 21.04.223 base APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='78571be679f586d11a4e56fb1ce6bf9dfd958ce6b8af786c4a3bd94792ce8c7c'
          curl --fail --location --retry 4 --retry-all-errors \
            --user-agent 'Mozilla/5.0' \
            'https://d.apkpure.net/b/APK/com.google.android.youtube?versionCode=1561052632' \
            -o build-input/youtube-21.04.223.apk
          test -s build-input/youtube-21.04.223.apk
          ACTUAL="$(sha256sum build-input/youtube-21.04.223.apk | awk '{print $1}')"
          echo "Base APK SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          unzip -tq build-input/youtube-21.04.223.apk >/dev/null

      - name: Patch first-version Extreme Tube
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-extreme-tube.sh
          scripts/build-extreme-tube.sh \
            build-input/morphe-desktop.jar \
            build-input/morphe-patches.mpp \
            "$EXTREME_MPP" \
            build-input/youtube-21.04.223.apk \
            ExtremeTube-v0.1-refined.apk

      - name: Verify refined APK
        shell: bash
        run: |
          set -euo pipefail
          test -s ExtremeTube-v0.1-refined.apk
          unzip -tq ExtremeTube-v0.1-refined.apk >/dev/null
          sha256sum ExtremeTube-v0.1-refined.apk | tee ExtremeTube-v0.1-refined.sha256
          printf '%s\n' \
            'Extreme Tube v0.1 Refined' \
            'Base: YouTube 21.04.223' \
            'Package requested: com.extremetube.app' \
            'Changes: Extreme settings branding; Morphe network-backed About entry removed; background playback restrictions removed.' \
            'Morphe GPL NOTICE/attribution remains bundled as required.' \
            > ExtremeTube-v0.1-refined-README.txt

      - name: Upload refined APK
        uses: actions/upload-artifact@v7
        with:
          name: ExtremeTube-v0.1-refined
          path: |
            ExtremeTube-v0.1-refined.apk
            ExtremeTube-v0.1-refined.sha256
            ExtremeTube-v0.1-refined-README.txt
          if-no-files-found: error
          retention-days: 14
