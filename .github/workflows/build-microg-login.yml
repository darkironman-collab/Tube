name: Build MicroG Login APK

on:
  workflow_dispatch:
  push:
    branches:
      - microg-login-build
    paths:
      - '.github/workflows/build-microg-login.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout pinned MicroG-RE source
        uses: actions/checkout@v6
        with:
          repository: MorpheApp/MicroG-RE
          ref: 4d4ee00fc9909f8b036d64f89ebaaf3979ccf412
          path: microg
          fetch-depth: 1

      - name: Set up Java 18
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '18'

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          cd microg
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED='4d4ee00fc9909f8b036d64f89ebaaf3979ccf412'
          echo "MicroG-RE commit: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          grep -F 'ext.basePackageName = "app.revanced"' build.gradle
          grep -F 'applicationId "${basePackageName}.android.gms"' play-services-core/build.gradle

      - name: Build login-compatible MicroG APK
        shell: bash
        run: |
          set -euo pipefail
          cd microg
          chmod +x gradlew
          ./gradlew :play-services-core:assembleDefaultDebug --no-daemon --stacktrace

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find microg/play-services-core/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          mkdir -p out
          cp "$APK" out/ExtremeGmsCore-login.apk
          sha256sum out/ExtremeGmsCore-login.apk | tee out/ExtremeGmsCore-login.sha256
          cat > out/BUILD-PROVENANCE.txt <<'EOF'
          ExtremeTube login GmsCore test build
          Upstream: MorpheApp/MicroG-RE
          Upstream commit: 4d4ee00fc9909f8b036d64f89ebaaf3979ccf412
          Upstream commit is GitHub-verified.
          Source modifications: none
          Expected package: app.revanced.android.gms
          Build variant: defaultDebug
          Purpose: Google account authentication/services for patched Google apps using GmsCore support.
          This first test build uses the Android debug signing key generated by the CI runner.
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExtremeGmsCore-login
          path: |
            out/ExtremeGmsCore-login.apk
            out/ExtremeGmsCore-login.sha256
            out/BUILD-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
