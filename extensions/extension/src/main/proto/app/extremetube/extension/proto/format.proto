syntax = "proto3";

package app.extremetube.extension.proto;

option optimize_for = LITE_RUNTIME;
option java_package = "app.extremetube.extension.proto";

// Deliberately excludes stream URLs, cookies, tokens and account data.
// Field numbers follow YouTube's adaptive format protobuf wire format.
message Format {
    int32 itag = 1;
    string mimeType = 5;
    int32 bitrate = 6;
    int32 width = 7;
    int32 height = 8;
    string quality = 16;
    int32 fps = 25;
    string qualityLabel = 26;
    int32 averageBitrate = 31;
    int64 approxDurationMs = 44;
}
